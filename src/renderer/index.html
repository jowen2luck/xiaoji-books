<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小鸡书友 · 智能文献考据伴侣</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Refined Editorial Palette */
        --color-bg: #faf8f5;
        --color-bg-warm: #f5f0e8;
        --color-bg-deep: #ede6d9;
        --color-surface: #ffffff;
        --color-surface-raised: #fffdf9;
        --color-ink: #1c1917;
        --color-ink-soft: #44403c;
        --color-ink-muted: #78716c;
        --color-ink-faint: #a8a29e;
        --color-accent: #b45309;
        --color-accent-light: #d97706;
        --color-accent-warm: #fef3c7;
        --color-accent-soft: #fffbeb;
        --color-info: #0e7490;
        --color-info-soft: #e0f7fa;
        --color-success: #047857;
        --color-success-soft: #d1fae5;
        --color-border: #e7e2da;
        --color-border-deep: #d6d0c5;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 10px;
        --radius-xl: 16px;
        --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
        --shadow-md: 0 2px 6px rgba(28, 25, 23, 0.06), 0 1px 2px rgba(28, 25, 23, 0.04);
        --shadow-lg: 0 8px 24px rgba(28, 25, 23, 0.08), 0 2px 6px rgba(28, 25, 23, 0.04);
        --font-display: 'Noto Serif SC', 'Source Han Serif CN', serif;
        --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

        /* 布局基线 */
        --h-topbar: 48px;
        --h-brandbar: 56px;
        --w-sidebar: 208px;
        --w-sidebar-collapsed: 56px;
        --w-content-max: 860px;
        --w-chat-panel: 380px;
        --w-trace-panel: 320px;

        /* 中文排版 */
        --fs-min: 12px;
        --ls-cjk: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-body);
        background-color: var(--color-bg);
        color: var(--color-ink);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      /* Refined scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border-deep);
        border-radius: 4px;
        border: 2px solid var(--color-bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-ink-faint);
      }

      /* Focus visible for keyboard navigation */
      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* Selection */
      ::selection {
        background: var(--color-accent-warm);
        color: var(--color-ink);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
